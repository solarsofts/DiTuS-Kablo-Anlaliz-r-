[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ditus-kablo-analizor"
version = "0.16.9.4.34"
description = "DiTuS Kablo Analizör engineering analysis application"
readme = "README_TR.md"
requires-python = ">=3.11,<3.13"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["ucd*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
